<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Cyber Dashboard</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(20, 20, 35, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --neon-cyan: #00f3ff;
            --neon-purple: #b000ff;
            --text-main: #ffffff;
            --text-muted: #8b8b9e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Arka Plan Hareketli Neon Efekti */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            filter: blur(120px);
            opacity: 0.25;
            z-index: -1;
            animation: moveGlow 10s infinite alternate ease-in-out;
        }

        @keyframes moveGlow {
            0% { transform: translate(-150px, -150px); }
            100% { transform: translate(150px, 150px); }
        }

        /* Ana Konteyner */
        .dashboard {
            width: 90%;
            max-width: 900px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* Sol Panel: Profil / Sistem Bilgisi */
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--border-color);
            padding-right: 30px;
        }

        @media (max-width: 768px) {
            .sidebar {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-right: 0;
                padding-bottom: 20px;
            }
        }

        .profile-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            background: linear-gradient(90deg, var(--text-main), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 8px 14px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--neon-cyan);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Sağ Panel: İstatistikler ve İnteraktif Alan */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 243, 255, 0.1);
        }

        .metric-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        /* Buton Tasarımı */
        .action-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: var(--text-main);
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 5px 15px rgba(176, 0, 255, 0.3);
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="dashboard">
        <!-- Sol Bölüm -->
        <div class="sidebar">
            <div class="profile-header">
                <h1>Nexus Core</h1>
                <p>Gelişmiş Sistem Arayüzü</p>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    Sistem Aktif
                </div>
            </div>
            <div style="color: var(--text-muted); font-size: 0.8rem;">
                v2.6.0 Enterprise Edition
            </div>
        </div>

        <!-- Sağ Bölüm -->
        <div class="main-content">
            <div class="metric-card">
                <div class="metric-title">Anlık İşlem Yükü</div>
                <div class="metric-value" id="loadCounter">%14</div>
            </div>

            <div class="metric-card">
                <div class="metric-title">Ağ Gecikmesi (Ping)</div>
                <div class="metric-value" id="pingCounter">12 ms</div>
            </div>

            <button class="action-btn" onclick="boostSystem()">Sistemi Boostla</button>
        </div>
    </div>

    <script>
        // İnteraktif JavaScript Efekti
        function boostSystem() {
            const loadEl = document.getElementById('loadCounter');
            const pingEl = document.getElementById('pingCounter');
            
            loadEl.style.color = 'var(--neon-cyan)';
            pingEl.style.color = 'var(--neon-cyan)';
            
            loadEl.innerText = '%99';
            pingEl.innerText = '3 ms';

            setTimeout(() => {
                loadEl.innerText = '%22';
                pingEl.innerText = '8 ms';
                loadEl.style.color = 'var(--text-main)';
                pingEl.style.color = 'var(--text-main)';
            }, 1500);
        }
    </script>
</body>
</html>
