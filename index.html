<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Tempolu Refleks Oyunu</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            text-align: center;
            position: relative;
        }
        #clicker-btn {
            width: 220px;
            height: 220px;
            background: linear-gradient(145deg, #ff6b6b, #ee5253);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(238, 82, 83, 0.4);
            transition: transform 0.05s ease, background 0.2s;
            outline: none;
        }
        #clicker-btn:active {
            transform: scale(0.92);
        }
        #stats {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
        #danger-alert {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 26px;
            color: #ff4757;
            font-weight: bold;
            display: none;
            animation: blink 0.4s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="danger-alert">🚨 DİKKAT: KAPI ÇALIYOR! DUR! 🚨</div>
        <div id="stats">Skor: <span id="score">0</span></div>
        <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Butona durmaksızın bas ama kapı sinyali gelince HEMEN DUR!</p>
        <button id="clicker-btn">BAK APARA</button>
    </div>

<script>
    const btn = document.getElementById("clicker-btn");
    const scoreSpan = document.getElementById("score");
    const dangerAlert = document.getElementById("danger-alert");

    let score = 0;
    let isDanger = false;
    let gameActive = true;

    // Rastgele aralıklarla kapı çalma alarmı (Tehlike anı)
    function triggerDanger() {
        if (!gameActive) return;
        
        isDanger = true;
        dangerAlert.style.display = "block";
        btn.style.background = "linear-gradient(145deg, #2f3542, #1e272e)";
        btn.innerText = "YAKALANDIN!";

        // 1.5 saniye içinde butona basan yanar
        setTimeout(() => {
            if (!gameActive) return;
            isDanger = false;
            dangerAlert.style.display = "none";
            btn.style.background = "linear-gradient(145deg, #ff6b6b, #ee5253)";
            btn.innerText = "DEVAM ET";
            
            // Sonraki tehlike için rastgele süre (3 ile 7 saniye arası)
            let nextTime = Math.random() * 4000 + 3000;
            setTimeout(triggerDanger, nextTime);
        }, 1500);
    }

    // Oyunu başlat
    setTimeout(triggerDanger, 4000);

    btn.addEventListener("click", () => {
        if (!gameActive) return;

        if (isDanger) {
            // Tehlike anında basarsa game over
            gameActive = false;
            dangerAlert.style.display = "none";
            btn.style.background = "#57606f";
            document.getElementById("game-container").innerHTML = `
                <h1 style="color: #ff4757; font-size: 36px;">YAKALANDIN!</h1>
                <p style="font-size: 22px;">Annen odayı bastı!</p>
                <p style="font-size: 20px; margin-top: 15px;">Toplam Skorun: <b>${score}</b></p>
                <button onclick="location.reload()" style="padding: 12px 25px; font-size: 18px; background: #2ed573; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px;">Tekrar Dene</button>
            `;
            return;
        }

        // Normal tıklama skoru artırır
        score++;
        scoreSpan.innerText = score;
    });
</script>

</body>
</html>
