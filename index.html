<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stres Çarkı Değil, Pop-It Zamanı! 🫧</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        p {
            color: #a0aec0;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .popit-board {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .bubble {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
            border: none;
            cursor: pointer;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.4), 0 5px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
        }

        .bubble:active {
            transform: scale(0.9);
        }

        /* Patlamış/Çukur Durumu */
        .bubble.popped {
            background: radial-gradient(circle at 70% 70%, #2d3436, #636e72);
            box-shadow: inset 0 8px 15px rgba(0,0,0,0.8), 0 2px 5px rgba(255,255,255,0.05);
            transform: scale(0.92);
        }

        .reset-btn {
            margin-top: 25px;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            color: #0b0f19;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            transition: 0.2s;
        }

        .reset-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body>

    <h1>🫧 Dijital Pop-It 🫧</h1>
    <p>Stresini atmak için balonlara tıkla!</p>

    <div class="popit-board" id="board"></div>

    <button class="reset-btn" onclick="resetBoard()">Hepsini Kaldır / Baştan Başla</button>

    <script>
        const board = document.getElementById('board');
        const totalBubbles = 16; // 4x4 Pop-it

        // Web Audio API ile gerçekçi "Pop" sesi üretici (Harici dosya gerektirmez!)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playPopSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            // Tıkladıkça tok ve tatlı bir pop sesi için frekans ayarı
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Balonları oluştur
        for (let i = 0; i < totalBubbles; i++) {
            const bubble = document.createElement('button');
            bubble.classList.add('bubble');
            
            // Renkleri biraz çeşitlendirelim
            const colors = [
                'radial-gradient(circle at 30% 30%, #ff7675, #d63031)', // Kırmızı
                'radial-gradient(circle at 30% 30%, #74b9ff, #0984e3)', // Mavi
                'radial-gradient(circle at 30% 30%, #55efc4, #00b894)', // Yeşil
                'radial-gradient(circle at 30% 30%, #ffeaa7, #fdcb6e)'  // Sarı
            ];
            bubble.style.background = colors[i % colors.length];

            bubble.addEventListener('click', () => {
                if (!bubble.classList.contains('popped')) {
                    bubble.classList.add('popped');
                    playPopSound(); // Sesi ç چال
                } else {
                    // Tekrar basınca eski haline gelsin
                    bubble.classList.remove('popped');
                    playPopSound();
                }
            });

            board.appendChild(bubble);
        }

        function resetBoard() {
            const bubbles = document.querySelectorAll('.bubble');
            bubbles.forEach(b => b.classList.remove('popped'));
            playPopSound();
        }
    </script>
</body>
</html>
