<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plasma Volume Core | Mobile Safe</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="info">⚡ Plasma Core / Tablet Ready</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;

        // Hacimsel Plazma Küresi Çizim Motoru
        function animate() {
            time += 0.03;
            
            // Ekranı hafif karartarak hareket izi (motion blur) efekti ver
            ctx.fillStyle = 'rgba(3, 5, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const baseRadius = Math.min(width, height) * 0.25;

            // Hacimsel katmanlar (İç içe geçen parlayan halkalar / plazma dalgaları)
            for (let i = 0; i < 40; i++) {
                let angle = time + (i * 0.15);
                let radius = baseRadius + Math.sin(time * 1.5 + i * 0.3) * 40;
                
                let x = centerX + Math.cos(angle * 0.7) * (i * 3);
                let y = centerY + Math.sin(angle * 0.5) * (i * 3);

                // Dinamik renk geçişi (Turkuaz -> Mor -> Pembe)
                let hue = (i * 8 + time * 50) % 360;
                
                ctx.beginPath();
                ctx.arc(x, y, Math.max(5, radius * (1 - i / 45)), 0, Math.PI * 2);
                
                let gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.15)`);
                gradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 100%, 50%, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.fill();
            }

            // Merkezdeki Ana Parlayan Enerji Çekirdeği
            let coreRadius = baseRadius * (0.8 + Math.sin(time * 3) * 0.1);
            let coreGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius);
            coreGrad.addColorStop(0, 'rgba(0, 255, 204, 0.8)');
            coreGrad.addColorStop(0.5, 'rgba(255, 0, 127, 0.3)');
            coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fillStyle = coreGrad;
            ctx.fill();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
