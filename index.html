<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Shader | Cyber Energy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: sans-serif;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="info">⚡ Volume Shader / Core Active</div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 2.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- MOBİL UYUMLU GLSL SHADER ---
        
        const vertexShader = `
            varying vec3 vPosition;
            void main() {
                vPosition = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            uniform float uTime;
            varying vec3 vPosition;

            // Basit ve Hızlı Gürültü (Noise)
            float hash(vec3 p) {
                p = fract(p * 0.3183099 + vec3(0.1));
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            float noise(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                               mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                           mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                               mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
            }

            void main() {
                vec3 p = vPosition * 1.5;
                // Zamanla hareket eden enerji dalgaları
                float n = noise(p + vec3(0.0, uTime * 0.8, 0.0));
                
                // Merkezden uzaklığa göre parlaklık (Küre efekti)
                float dist = length(vPosition);
                float alpha = smoothstep(1.0, 0.2, dist) * n;

                // Renkler (Turkuaz ve Neon Pembe)
                vec3 col1 = vec3(0.0, 1.0, 0.8);
                vec3 col2 = vec3(1.0, 0.0, 0.5);
                vec3 finalColor = mix(col1, col2, sin(uTime + dist * 3.0) * 0.5 + 0.5);

                gl_FragColor = vec4(finalColor * 1.5, alpha * 2.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                uTime: { value: 0.0 }
            },
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const geometry = new THREE.SphereGeometry(1.0, 64, 64);
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            material.uniforms.uTime.value = clock.getElapsedTime();
            sphere.rotation.y += 0.01;
            sphere.rotation.x += 0.005;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
