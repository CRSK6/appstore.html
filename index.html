<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Shader | Cyber Energy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Poppins', sans-serif;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="info">⚡ Volume Shader / Raymarching Core</div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Sahne, Kamera ve Renderer Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- GLSL SHADER KODLARI ---
        
        const vertexShader = `
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec2 uResolution;
            varying vec3 vWorldPosition;
            varying vec2 vUv;

            // Basit 3D Gürültü (Noise) Fonksiyonu
            float hash(vec3 p) {
                p = fract(p * 0.3183099+.1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            float noise(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                               mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                           mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                               mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
            }

            // FBM (Hacimsel Bulut Katmanları)
            float fbm(vec3 p) {
                float sum = 0.0;
                float amp = 0.5;
                for (int i = 0; i < 4; i++) {
                    sum += amp * noise(p);
                    p *= 2.0;
                    amp *= 0.5;
                }
                return sum;
            }

            void main() {
                // Raymarching Koordinatları ve Işın Efekti
                vec3 rayDir = normalize(vWorldPosition - cameraPosition);
                vec3 pos = vWorldPosition;
                
                float density = 0.0;
                // Hacimsel tarama döngüsü (Raymarching adımları)
                for (int i = 0; i < 32; i++) {
                    vec3 p = pos + rayDir * float(i) * 0.03;
                    // Zamanla hareket eden gürültü dalgaları
                    float n = fbm(p * 1.5 + vec3(0.0, uTime * 0.5, 0.0));
                    // Küresel maske (ortada toplansın)
                    float sphereDist = length(p) - 1.0;
                    if (sphereDist < 0.0) {
                        density += max(0.0, (0.5 - sphereDist) * n * 0.15);
                    }
                }

                // Renk paleti (Cyberpunk Turkuaz / Mor geçişi)
                vec3 col1 = vec3(0.0, 1.0, 0.8); // Turkuaz
                vec3 col2 = vec3(0.8, 0.0, 0.5); // Neon Mor
                vec3 finalColor = mix(col1, col2, density * 2.0 + sin(uTime) * 0.25);

                // Çıkış rengi ve saydamlık (alpha)
                gl_FragColor = vec4(finalColor, density * 3.0);
            }
        `;

        // Shader Materyali
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: {
                uTime: { value: 0.0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
            },
            transparent: true,
            blending: THREE.AdditiveBlending, // Parlak ışık efekti için
            side: THREE.BackSide
        });

        // Geometri (Küre)
        const geometry = new THREE.SphereGeometry(1.2, 32, 32);
        const volumeMesh = new THREE.Mesh(geometry, material);
        scene.add(volumeMesh);

        // Pencere Boyutu Ayarı
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animasyon Döngüsü
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            // Zamanı güncelle
            material.uniforms.uTime.value = clock.getElapsedTime();

            // Küreyi yavaşça döndür
            volumeMesh.rotation.y += 0.005;
            volumeMesh.rotation.x += 0.002;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
